services:
  gateway:
    build: ./gateway
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mock-a
      - mock-b

  mock-a:
    build: ./mock_service
    environment:
      NODE_NAME: mock-a

  mock-b:
    build: ./mock_service
    environment:
      NODE_NAME: mock-b

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: renderfarm
      POSTGRES_USER: renderfarm
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-renderfarm_dev}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "renderfarm", "-d", "renderfarm"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  render-api:
    build: ./render_api
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: renderfarm
      PGUSER: renderfarm
      PGPASSWORD: "${POSTGRES_PASSWORD:-renderfarm_dev}"
    depends_on:
      postgres:
        condition: service_healthy
        
volumes:
  postgres_data:
  redis_data: