services:
  gateway:
    build: ./gateway
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mock-a
      - mock-b
      - render-api

  mock-a:
    build: ./mock_service
    environment:
      NODE_NAME: mock-a

  mock-b:
    build: ./mock_service
    environment:
      NODE_NAME: mock-b

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: renderfarm
      POSTGRES_USER: renderfarm
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-renderfarm_dev}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "renderfarm", "-d", "renderfarm"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    image: postgres:16
    environment: &postgres-client
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: renderfarm
      PGUSER: renderfarm
      PGPASSWORD: "${POSTGRES_PASSWORD:-renderfarm_dev}"
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for migration in /migrations/*.sql; do
          psql -v ON_ERROR_STOP=1 -f "$$migration"
        done
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  render-api:
    build: ./render_api
    environment:
      <<: *postgres-client
      REDIS_URL: redis://redis:6379/0
      STATUS_CACHE_ENABLED: "${STATUS_CACHE_ENABLED:-1}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - render_output:/renders:ro

  publisher:
    build: ./publisher
    environment:
      <<: *postgres-client
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./worker
    environment:
      <<: *postgres-client
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - render_output:/renders

volumes:
  postgres_data:
  redis_data:
  render_output:
